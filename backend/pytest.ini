[pytest]
# rootdir is backend/, so `detection`, `evaluation`, `app` and `generator`
# import the same way they do in production. No sys.path fiddling in conftest.
testpaths = tests
pythonpath = .

# -q keeps the output readable next to the verify_* scripts, which are the
# other half of this project's checking and print their own report.
addopts = -q --strict-markers --tb=short

filterwarnings =
    error::DeprecationWarning:detection.*
    error::DeprecationWarning:evaluation.*
