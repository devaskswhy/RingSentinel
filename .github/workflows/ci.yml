name: CI

# Runs on every push and PR. Two jobs, matching the two halves of the project.
#
# ⚠️ WHY THE DATABASE-BACKED VERIFIERS ARE NOT HERE
#
# `scripts/verify_human_gate.py`, `verify_resilience.py`, `verify_ingest.py` and
# `verify_detector_isolation.py` are this project's strongest evidence — they
# break a guarantee for real against a live database and require it to refuse.
# They are deliberately NOT in CI, and the reason is the point rather than an
# omission: they need the seeded corpus, and on an empty database they FAIL
# rather than pass.
#
# That was measured, not assumed. Against a freshly migrated, unseeded database
# four of the five exit non-zero. A checker that reported success over an empty
# set is the exact failure this project has shipped four times (CLAUDE.md §7a),
# so verifiers that refuse to run without data are behaving correctly — and
# wiring them to a green tick they cannot honestly earn would reintroduce the
# very bug the repo keeps documenting.
#
# Run them locally, against the real corpus:
#   docker compose exec backend python -m scripts.verify_human_gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · 59 unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        working-directory: backend
        # Pure: no database, no network, no model calls. Covers the scoring
        # arithmetic, the four product invariants reachable statically, and
        # every bug that shipped once.
        run: python -m pytest

      - name: The grader must still be able to fail
        working-directory: backend
        # Feeds the case-file grader one honest file and four broken ones, and
        # requires each defect to be caught BY THE CRITERION MEANT TO CATCH IT.
        # A grader that matches nothing also reports 100%; this is what stops
        # that passing silently. No database needed.
        run: python -m scripts.verify_explanation_grader

  frontend:
    name: frontend · typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        # Separate from the build on purpose: `next build` once reported
        # "Compiled successfully" and then failed type checking on a stale
        # generated artifact. Running tsc on its own says which one broke.
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          # The landing page renders every figure from measured fallbacks, so
          # it builds without a backend. That is a product property, and this
          # job is where it stays true.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: npx next build
